title: Shell परिचय
description: >-
  Unix कमांड लाइन लगभग 50 सालों से इसलिए प्रचलित और सफल है क्योंकि यह लोगों को
  कुछ ही कीस्ट्रोक्स में जटिल काम करने देती है। इसे अक्सर "प्रोग्रामिंग का
  यूनिवर्सल ग्लू" भी कहा जाता है, क्योंकि यह उपयोगकर्ताओं को मौजूदा प्रोग्रामों
  को नए तरीकों से जोड़ने, दोहराए जाने वाले कार्यों को ऑटोमेट करने, और ऐसे
  क्लस्टर्स व क्लाउड्स पर प्रोग्राम चलाने में मदद करती है जो दुनिया के किसी भी
  कोने में हो सकते हैं। यह कोर्स इसके प्रमुख हिस्सों से आपको परिचित कराएगा और
  उन्हें कुशलतापूर्वक इस्तेमाल करना सिखाएगा.


  कोर्स का ग्लॉसरी दाएँ तरफ Resources सेक्शन में उपलब्ध है.

  CPE क्रेडिट्स पाने के लिए आपको कोर्स पूरा करना होगा और क्वालिफाइड असेसमेंट में
  70% स्कोर हासिल करना होगा। दाएँ तरफ CPE क्रेडिट्स कॉलआउट पर क्लिक करके आप
  असेसमेंट तक जा सकते हैं.
programming_language: shell
from: shell-base-prod:v1.1.3
