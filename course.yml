title: Introducere în Shell
description: >-
  Linia de comandă Unix a supraviețuit și s-a dezvoltat timp de aproape 50 de
  ani, deoarece le permite utilizatorilor să facă lucruri complexe cu doar
  câteva apăsări de taste. Uneori numită „lipiciul universal al programării", îi
  ajută pe utilizatori să combine programe existente în moduri noi, să
  automatizeze sarcini repetitive și să ruleze programe pe clustere și în cloud,
  oriunde în lume. Acest curs îți va prezenta elementele esențiale și îți va
  arăta cum să le folosești eficient.


  Glosarul cursului se găsește în dreapta, în secțiunea de resurse.

  Pentru a obține credite CPE, trebuie să finalizezi cursul și să obții un scor
  de 70% la evaluarea calificată. Poți naviga la evaluare făcând clic pe
  notificarea privind creditele CPE din dreapta.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
