title: Shell 入門
description: >-
  Unix 指令列之所以能流傳並蓬勃發展近 50
  年，是因為只要敲幾個鍵就能完成複雜工作。它有時被稱為「程式設計的萬用膠水」，能讓使用者用全新的方式組合現有程式、自動化重複性任務，並在遠在世界另一端的叢集與雲端上執行程式。本課程將介紹其核心要素，並示範如何有效運用。


  你可以在右側的資源區找到課程術語表。

  若要取得 CPE 學分，你需要完成課程，並在合格測驗中達到 70% 的分數。你可以點選右側的 CPE 學分提示前往該測驗。
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
