title: Introduction to Shell
description: >-
  Příkazový řádek Unixu přežil a prosperuje téměř 50 let, protože umožňuje dělat
  složité věci jen s několika stisky kláves. Někdy se mu říká „univerzální tmel
  programování" – pomáhá kombinovat existující programy novými způsoby,
  automatizovat opakující se úkoly a spouštět programy na clusterech a v cloudu
  třeba na druhém konci světa. Tento kurz ti představí jeho klíčové prvky a
  ukáže, jak je efektivně využívat.


  Glosář kurzu najdeš napravo v sekci zdroje.

  Pro získání CPE kreditů musíš kurz dokončit a dosáhnout skóre alespoň 70 % v
  kvalifikovaném hodnocení. K hodnocení se dostaneš kliknutím na upozornění CPE
  kreditů napravo.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
