title: Introduction to Shell
description: >-
  Command line ของ Unix ยืนหยัดและเติบโตมาเกือบ 50 ปี
  เพราะช่วยให้ทำสิ่งที่ซับซ้อนได้ด้วยการพิมพ์เพียงไม่กี่ครั้ง
  บางครั้งถูกเรียกว่า "กาวสากลของการเขียนโปรแกรม"
  เพราะช่วยให้นำโปรแกรมที่มีอยู่มาผสมผสานกันในรูปแบบใหม่ ทำงานซ้ำๆ ได้อัตโนมัติ
  และรันโปรแกรมบน cluster หรือ cloud ที่อยู่ห่างออกไปได้
  คอร์สนี้จะแนะนำองค์ประกอบสำคัญของ Shell และวิธีใช้งานอย่างมีประสิทธิภาพ


  ดูคำศัพท์ประจำคอร์สได้ที่แถบทรัพยากรด้านขวา

  เพื่อรับหน่วยกิต CPE ต้องทำคอร์สให้ครบและได้คะแนนอย่างน้อย 70%
  ในการประเมินที่กำหนด สามารถไปยังแบบประเมินได้โดยคลิกที่ส่วน CPE credits
  ด้านขวา
programming_language: shell
from: shell-base-prod:v1.1.3
