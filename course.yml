title: Introduction à l'invite de commande
description: >-
  La ligne de commande Unix a non seulement survécu, mais prospéré depuis près
  de 50 ans, car elle permet d'accomplir des tâches complexes en quelques
  frappes seulement. Parfois appelée « la colle universelle de la
  programmation », elle aide à combiner des programmes existants de nouvelles
  façons, à automatiser des tâches répétitives et à exécuter des programmes sur
  des grappes et dans le nuage, parfois à l'autre bout du monde. Ce cours
  présente ses éléments clés et vous montre comment les utiliser efficacement.


  Le glossaire du cours se trouve à droite, dans la section des ressources.

  Pour obtenir des crédits CPE, vous devez terminer le cours et atteindre une
  note de 70 % à l'évaluation admissible. Vous pouvez accéder à l'évaluation en
  cliquant sur l'encadré des crédits CPE à droite.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
