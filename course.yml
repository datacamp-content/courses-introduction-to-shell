title: Wprowadzenie do powłoki systemowej
description: >-
  Wiersz poleceń systemu Unix przetrwał i rozwinął się przez prawie 50 lat,
  ponieważ pozwala wykonywać złożone operacje za pomocą zaledwie kilku naciśnięć
  klawiszy. Określany niekiedy „uniwersalnym spoiwem programowania", umożliwia
  łączenie istniejących programów w nowy sposób, automatyzowanie powtarzalnych
  zadań oraz uruchamianie programów na klastrach i w chmurze – nawet po drugiej
  stronie globu. Ten kurs przedstawia kluczowe elementy powłoki i pokazuje, jak
  efektywnie z niej korzystać.


  Słowniczek kursu znajdziesz po prawej stronie, w sekcji zasobów.

  Aby uzyskać punkty CPE, ukończ kurs i zdobądź co najmniej 70% punktów w
  kwalifikowanej ocenie. Przejdź do oceny, klikając informację o punktach CPE po
  prawej stronie.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
