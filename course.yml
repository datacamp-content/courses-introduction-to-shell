title: Introduktion till Shell
description: >-
  Unix-kommandoraden har överlevt och blomstrat i nästan 50 år – den låter dig
  göra komplexa saker med bara några knapptryckningar. Den kallas ibland för
  "programmeringens universallim" och hjälper användare att kombinera befintliga
  program på nya sätt, automatisera återkommande uppgifter och köra program på
  kluster och i molnet, oavsett var i världen de befinner sig. Den här kursen
  introducerar de viktigaste delarna och visar hur du använder dem effektivt.


  Kursens ordlista finns till höger i resurssektionen.

  För att få CPE-poäng behöver du slutföra kursen och nå 70 % på den
  kvalificerade bedömningen. Du navigerar till bedömningen via CPE-poänglänken
  till höger.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
