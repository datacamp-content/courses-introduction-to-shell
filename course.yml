title: Shell 入門
description: >-
  Unix
  のコマンドラインは、わずかなキー操作で複雑な処理を実行できることから、50年近くにわたって使われ続けています。「プログラミングの万能な糊」とも呼ばれ、既存のプログラムを新しい方法で組み合わせたり、繰り返し作業を自動化したり、地球の反対側にあるクラスターやクラウド上でプログラムを実行したりすることを可能にします。このコースでは、その主要な要素を紹介し、それらを効率的に使う方法を解説します。


  コースの用語集は、右側のリソースセクションで確認できます。

  CPE クレジットを取得するには、コースを修了し、認定アセスメントで70%以上のスコアを獲得する必要があります。右側の CPE
  クレジットのコールアウトをクリックすると、アセスメントに移動できます。
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
