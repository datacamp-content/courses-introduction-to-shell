title: Вступ до Shell
description: >-
  Командний рядок Unix зберігає актуальність уже майже 50 років, адже дає змогу
  виконувати складні дії кількома натисканнями клавіш. Його інколи називають
  «універсальним клеєм програмування»: він допомагає по-новому поєднувати наявні
  програми, автоматизувати рутинні завдання та запускати програми на кластерах і
  в хмарі, що можуть бути за півсвіту від вас. У цьому курсі ви познайомитеся з
  ключовими елементами командного рядка та навчитеся користуватися ним
  ефективно.


  Глосарій курсу розміщений праворуч у розділі ресурсів.

  Щоб отримати кредити CPE, потрібно завершити курс і набрати 70% на
  підсумковому оцінюванні. Перейти до оцінювання можна, натиснувши на позначку
  CPE-кредитів праворуч.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
