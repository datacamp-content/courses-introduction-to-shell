title: Введение в Shell
description: >-
  Командная строка Unix существует уже почти 50 лет — и по-прежнему остаётся
  незаменимым инструментом, позволяющим решать сложные задачи буквально
  несколькими нажатиями клавиш. Её нередко называют «универсальным связующим
  звеном программирования»: она помогает комбинировать существующие программы
  новыми способами, автоматизировать повторяющиеся задачи и запускать программы
  на кластерах и в облаке в любой точке мира. В этом курсе вы познакомитесь с
  ключевыми элементами командной строки и научитесь использовать их эффективно.


  Глоссарий курса доступен справа в разделе ресурсов.

  Чтобы получить баллы CPE, необходимо завершить курс и набрать не менее 70% в
  итоговом тесте. Перейти к тесту можно, нажав на блок CPE credits справа.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
