title: Pengantar Shell
description: >-
  Baris perintah Unix telah bertahan dan berkembang selama hampir 50 tahun
  karena memungkinkan orang melakukan hal-hal kompleks hanya dengan beberapa
  ketukan tombol. Sering disebut sebagai "lem universal pemrograman," baris
  perintah membantu pengguna menggabungkan program yang sudah ada dengan cara
  baru, mengotomatisasi tugas berulang, dan menjalankan program pada klaster dan
  cloud yang mungkin berada di seberang dunia. Kursus ini akan memperkenalkan
  elemen-elemennya yang utama dan menunjukkan cara menggunakannya secara
  efisien.


  Glosarium kursus dapat ditemukan di sebelah kanan pada bagian sumber daya.

  Untuk memperoleh kredit CPE, Anda perlu menyelesaikan kursus dan mencapai skor
  70% pada penilaian yang memenuhi syarat. Anda dapat menuju ke penilaian dengan
  mengeklik ajakan kredit CPE di sebelah kanan.
programming_language: shell
from: shell-base-prod:v1.1.3
datasets:
  Introduction to Shell.pdf: Course Glossary
